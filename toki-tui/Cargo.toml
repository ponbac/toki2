[package]
name = "toki-tui"
version = "0.3.0"
edition = "2021"

[dependencies]
# TUI framework
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-piechart = "1.0.3"
throbber-widgets-tui = "0.11.1"

# Async runtime
tokio.workspace = true

# HTTP client
reqwest = { workspace = true, features = ["json", "cookies"] }

# Time handling (same as toki-api)
time = { workspace = true, features = [
  "serde",
  "formatting",
  "parsing",
  "macros",
  "local-offset",
] }

# Error handling
anyhow.workspace = true

# Configuration
config.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
toml = "1.1.8"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Fuzzy matching
fuzzy-matcher = "0.3.7"

# URL encoding
urlencoding = "2.1.3"

# Password input (no echo)
rpassword = "7.5.4"

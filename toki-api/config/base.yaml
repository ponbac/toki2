application:
  port: 8180
database:
  host: "localhost"
  port: 5433
  username: "postgres"
  password: "password"
  database_name: "toki"
auth:
  # client_id: "provide through env"
  # client_secret: "provide through env"
  auth_url: "https://login.microsoftonline.com/d89ef75c-38db-4904-9d78-b872502ca145/oauth2/v2.0/authorize?scope=https://graph.microsoft.com/.default"
  token_url: "https://login.microsoftonline.com/d89ef75c-38db-4904-9d78-b872502ca145/oauth2/v2.0/token"
kleer:
  # token: "provide through TOKI_KLEER__TOKEN"
  # company_id: "provide through TOKI_KLEER__COMPANY_ID"
  base_url: "https://api.kleer.se/v1"
ai_usage:
  # IANA time zone that defines AI usage days and billing months.
  time_zone: "Europe/Stockholm"
  # The earliest hour (RFC 3339) a reprice-only upload from token-ledger may
  # change. Stored costs before it stay as they are.
  reprice_floor: "2026-10-01T00:00:00Z"
  # The first UTC day the GitHub usage import covers. Local runs can shorten it
  # with TOKI_AI_USAGE__METERED_IMPORT__BACKFILL_FROM.
  metered_import:
    backfill_from: "2026-09-01"
  # The first UTC month whose bill takes GitHub Copilot's lines from GitHub's own
  # credits ($0.01 each). Earlier months keep Toki's estimates. Remove it, or set
  # TOKI_AI_USAGE__METERED_COPILOT_FROM="", to roll back.
  metered_copilot_from: "2026-10"
  # Monthly average exchange rates to SEK, the billing currency (Riksbank SWEA API).
  exchange_rates:
    base_url: "https://api.riksbank.se/swea/v1"
    # subscription_key: "optional; provide through TOKI_AI_USAGE__EXCHANGE_RATES__SUBSCRIPTION_KEY"
github:
  # The organization whose Copilot seats Toki reads, through the GitHub App
  # "Spinit Toki Billing" (spinit-toki-billing, App ID 5459019) installed on it.
  organization: "Spinit-AB"
  api_base: "https://api.github.com"
  app_client_id: "Iv23liEuEJDWE4ifGVp8"
  installation_id: 174922684
  # app_private_key: "provide through TOKI_GITHUB__APP_PRIVATE_KEY; without it
  # the GitHub account directory and usage import are off and the app still starts"
observability:
  capture_request_bodies: false
  request_body_max_logged_bytes: 16384
  request_body_max_buffered_bytes: 65536

[package]
name = "toki-api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
az-devops = { path = "../az-devops" }
kleer = { path = "../kleer" }
dotenvy.workspace = true
itertools = "0.15.0"
serde.workspace = true
serde_json.workspace = true
serde_with = "3.24.0"
tokio.workspace = true
time = { workspace = true, features = ["macros"] }
chrono.workspace = true
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "with-rejection"] }
config.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "time",
    "local-time",
    "json",
] }
opentelemetry = { version = "0.33.1", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "trace",
    "logs",
    "grpc-tonic",
] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = [
    "tracing-log",
] }
opentelemetry-appender-tracing = { version = "0.33.1", features = [
    "experimental_span_attributes",
] }
bytes = "1.12.1"
http-body-util = "0.1.5"
regex = "1.13.1"
htmd = "0.5.5"
ammonia = "4.2.4"
futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
strum = { version = "0.28.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "time",
    "migrate",
    "uuid",
] }
# The latest published session store still uses SQLx 0.8. Keep its pool private
# to session persistence while the application uses SQLx 0.9.
sqlx-session = { package = "sqlx", version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "time",
] }
axum-login = "0.18.0"
thiserror.workspace = true
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { workspace = true, features = ["json"] }
# RS256 for the GitHub App JWT. Already built for rustls. Never sign with the rsa
# crate (RUSTSEC-2023-0071, see .cargo/audit.toml).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
pem = "3"
# Name folding for provider account suggestions.
unicode-normalization = "0.1"
async-trait = "0.1.92"
crossbeam = { version = "0.8.5", features = ["crossbeam-channel"] }
web-push = "0.11.0"
url = "2.5.8"
aes-gcm = "0.11.1"
base64.workspace = true
strum_macros = "0.28.0"
tower-sessions-moka-store = "0.15.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
utoipa = "6.0.0"
image = { version = "0.25.10", features = ["jpeg", "png"] }
webp = "0.3.1"
moka = { version = "0.12.16", features = ["future", "sync"] }
rand = "0.10.3"
sha2 = "0.11.1"
uuid = "1.28.0"
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "elicitation",
    "request-state",
] }
schemars = "1.2.3"

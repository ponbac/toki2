[workspace]
resolver = "2"
members = ["toki-api", "az-devops", "kleer", "toki-tui"]

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = { version = "0.1.44", features = ["attributes"] }
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.deploy]
inherits = "release"
lto = "thin"
codegen-units = 16

name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "toki-api/**"
      - "az-devops/**"
      - "kleer/**"
      - "toki-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "toki-api/**"
      - "az-devops/**"
      - "kleer/**"
      - "toki-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/backend.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `#[sqlx::test]` creates and drops a database per test on this disposable server.
      DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Run tests
        run: cargo test --all-features

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SQLite is absent from the build
        shell: bash
        run: |
          dependencies=$(cargo tree --locked --workspace --all-features --target all -e all --prefix none)
          if grep -q '^libsqlite3-sys v' <<< "$dependencies"; then
            echo 'SQLite is in the build. Revisit the RUSTSEC-2026-0459 audit exception.'
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      - name: Run cargo-audit
        run: cargo audit
